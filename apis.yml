aid: border0
name: Border0
description: >-
  Border0 is an identity-aware Zero Trust network access platform for securing access to
  infrastructure — SSH and RDP servers, PostgreSQL/MySQL/MSSQL/MongoDB/Elasticsearch
  databases, Kubernetes clusters, AWS consoles and S3 buckets, and any internal HTTP or TCP
  service. Instead of VPNs and shared credentials, Border0 publishes each resource as a
  policy-gated "socket," authenticates users through their existing SSO/identity provider,
  and records every session for audit. Its REST admin API (api.border0.com/api/v1) manages
  sockets, access policies, connectors, organizations, identity providers, service accounts,
  tokens, sessions, and audit logs, and is complemented by an official Go SDK, a Terraform
  provider, a CLI, and GitHub Actions. Border0 was acquired by Tailscale in March 2026.
